<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10121a">
  <title>Nutrino | Static AI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-icon">N</span><span>Nutrino <small>AI</small></span></a>
      <div class="status" id="status" data-state="loading" role="status"><i></i> <span id="status-text">LOADING SCRIPT</span></div>
      <button id="new-session" class="new-session" type="button">＋ <span>New session</span></button>
    </header>
    <section class="stage" id="stage" tabindex="-1">
      <div class="welcome" id="welcome">
        <div class="orb" aria-hidden="true"><span></span></div>
        <p class="eyebrow">A SPACE TO THINK OUT LOUD</p>
        <h1>What has been<br><em>on your mind?</em></h1>
        <p class="welcome-copy">Tell me what is happening. We can explore it together, one thought at a time.</p>
        <div class="prompts" id="prompts">
          <button type="button" data-prompt="I have been feeling unhappy lately.">I've been feeling unhappy</button>
          <button type="button" data-prompt="I want to talk about my family.">I want to talk about family</button>
          <button type="button" data-prompt="I am not sure what is bothering me.">I'm not sure what's bothering me</button>
          <button type="button" data-prompt="I dreamed about my childhood.">I had a strange dream</button>
          <button type="button" data-prompt="I feel lonely and nobody understands me.">I feel lonely</button>
        </div>
      </div>
      <div class="conversation" id="conversation" role="log" aria-live="polite" aria-label="Conversation with Nutrino"></div>
    </section>
    <section class="composer-area">
      <form id="composer" class="composer">
        <label class="sr-only" for="message">Message Nutrino</label>
        <textarea id="message" rows="1" maxlength="2000" autocomplete="off" enterkeyhint="send" placeholder="Write what's on your mind…" disabled></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled>↑</button>
      </form>
      <p class="disclaimer">Nutrino is a rule-based static AI, not a medical professional. Enter to send · Shift+Enter for a new line.</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
  <noscript><p style="text-align:center;color:#ccc">Nutrino needs JavaScript to run.</p></noscript>
</body>
</html>
